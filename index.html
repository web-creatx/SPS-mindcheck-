<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mind Check · World Mental Health Day</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Noto+Nastaliq+Urdu:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#14243d;--mute:#5a6b85;--brand:#0b2d5b;--brand2:#e8f0fb;--gold:#e9a60f;--line:#d6e0f0;--warn:#fff3d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1e1e;--card:#172b2b;--ink:#e6f0ee;--mute:#9db5b2;--brand:#5fc0b8;--brand2:#1f3a39;--line:#2b4745;--warn:#3a2f1a}}
:root[data-theme="dark"]{--bg:#0f1e1e;--card:#172b2b;--ink:#e6f0ee;--mute:#9db5b2;--brand:#5fc0b8;--brand2:#1f3a39;--line:#2b4745;--warn:#3a2f1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 0 0,rgba(233,166,15,.28),transparent 40%),radial-gradient(circle at 100% 30%,rgba(138,79,214,.22),transparent 40%),radial-gradient(circle at 0 100%,rgba(31,157,85,.2),transparent 40%),var(--bg);background-attachment:fixed;color:var(--ink);font:17px/1.6 "Source Sans 3",system-ui,sans-serif}
body.ur{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;line-height:2.2}
h1,h2{font-family:Fraunces,Georgia,serif;line-height:1.2;margin:.2em 0}
body.ur h1,body.ur h2{font-family:"Noto Nastaliq Urdu",serif;line-height:1.9}
.wrap{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:14px;border-radius:18px;background:linear-gradient(120deg,#0b2d5b,#1d5fd1 60%,#8a4fd6);color:#fff}
#logo{width:64px;height:64px;flex:none;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #e9a60f;overflow:hidden}
#logo img{width:100%;height:100%;object-fit:cover}
.org{flex:1;font-size:14px;line-height:1.35;color:#fff}
body.ur .org{line-height:2}
#lang{border:0;background:#e9a60f;color:#2a1d00;border-radius:99px;padding:6px 14px;font:600 15px "Noto Nastaliq Urdu","Source Sans 3",sans-serif;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--sec,#e9a60f);border-radius:18px;padding:24px 20px}
.date{display:inline-block;background:var(--gold);color:#2a1d00;border-radius:8px;padding:2px 12px;font-weight:600;font-size:15px}
h1{font-size:2rem}h2{font-size:1.35rem}
p{margin:.6em 0}
.mute{color:var(--mute);font-size:15px}
.btn{display:block;width:100%;text-align:inherit;border:1.5px solid var(--line);border-inline-start:6px solid var(--sec,var(--line));background:var(--card);color:var(--ink);border-radius:12px;padding:13px 16px;margin:10px 0;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--sec);background:var(--brand2)}
.btn:focus-visible,#lang:focus-visible,.go:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.go{background:var(--sec,var(--brand));color:#fff;border:0;border-radius:12px;padding:13px 22px;font:600 17px inherit;font-family:inherit;cursor:pointer;margin-top:12px}
.link{background:none;border:0;color:var(--brand);font:inherit;cursor:pointer;padding:8px 0;text-decoration:underline}
.bar{height:8px;background:var(--brand2);border-radius:9px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .25s}
.lvl{border-inline-start:6px solid var(--c);padding:6px 16px;margin:12px 0;background:var(--brand2);border-radius:6px}
.care{background:var(--warn);border:1px solid var(--gold);border-radius:12px;padding:12px 16px;margin:14px 0}
ul{padding-inline-start:22px}.seg{display:flex;gap:4px;margin:6px 0 16px}.seg i{height:8px;background:var(--brand2);border-radius:9px;overflow:hidden}.seg b{display:block;height:100%}.tag{display:inline-block;color:#fff;border-radius:99px;padding:1px 14px;font-size:14px;margin:4px 6px 4px 0}.m{margin:16px 0}.m b{display:flex;justify-content:space-between}.mt{height:12px;background:var(--brand2);border-radius:9px;overflow:hidden;margin:4px 0}.mt i{display:block;height:100%;border-radius:9px}.ref{font-size:14px;color:var(--mute)}summary{cursor:pointer;color:var(--mute);margin:14px 0}li{margin:.5em 0}
footer{font-size:13.5px;color:var(--mute);padding:18px 4px}
@media print{#lang,.go,.link{display:none}}
</style>
</head>
